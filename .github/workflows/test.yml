name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Dependency manifests
        run: go mod tidy -diff
      - name: Test
        # Runs the golden suite plus the dedicated gates:
        #   TestLICENSEIsCanonicalApache  (#4)
        #   TestSamplesTextContrast       (#5 — contrast-clean samples)
        #   TestBadCaseIntake             (#12 — intake scaffolding present)
        run: go test ./...
      - name: WASM build
        run: GOOS=js GOARCH=wasm go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: WASM geometry regressions
        run: |
          env -i PATH="$PATH" HOME="$HOME" GOOS=js GOARCH=wasm \
            go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" . \
            -run 'TestSpatialPainterForegroundOrderWithoutRasterizer|TestSpatialClipParityAndOwnership|TestIsoRouteCrowding|TestRegion' \
            -count=1
